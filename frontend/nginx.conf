server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El cliente nunca debe cachear respuestas de la API.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # El bundle lleva hash en el nombre: se puede cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea, para que un despliegue nuevo se vea de inmediato.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA: cualquier ruta desconocida devuelve el index y la resuelve el router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy al API: mismo origen, así que el navegador no aplica CORS.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_read_timeout 60s;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
}